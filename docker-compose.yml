version: '3.8'

services:
  db:
    image: postgres:15
    container_name: starinc-postgres
    environment:
      POSTGRES_USER: starinc_user
      POSTGRES_PASSWORD: starinc_password
      POSTGRES_DB: starinc_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: starinc-backend
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://starinc_user:starinc_password@db:5432/starinc_db?schema=public"
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/public/uploads
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: starinc-frontend
    depends_on:
      - backend
    environment:
      BACKEND_URL: "http://backend:5000"
    ports:
      - "3000:3000"
    restart: always

volumes:
  pgdata:
  backend_uploads:
