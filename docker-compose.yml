
services:
  db:
    image: postgres:15
    container_name: starinc-postgres
    environment:
      POSTGRES_USER: starinc_user
      POSTGRES_PASSWORD: starinc_password
      POSTGRES_DB: starinc_db
    # Port 5432 hanya expose internal, tidak ke host
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: starinc-backend
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://starinc_user:starinc_password@db:5432/starinc_db?schema=public"
    # Port backend hanya expose internal, tidak ke host
    expose:
      - "5000"
    volumes:
      - backend_uploads:/app/public/uploads
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: starinc-frontend
    depends_on:
      - backend
    environment:
      BACKEND_URL: "http://backend:5000"
    expose:
      - "3000"
    restart: always

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend

volumes:
  pgdata:
  backend_uploads:
