version: '3.8'

services:
  db:
    image: postgres:15
    container_name: starinc-postgres
    environment:
      POSTGRES_USER: starinc_user
      POSTGRES_PASSWORD: starinc_password
      POSTGRES_DB: starinc_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starinc_user -d starinc_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: starinc-backend
    environment:
      DATABASE_URL: "postgresql://starinc_user:starinc_password@db:5432/starinc_db?schema=public"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: always
    volumes:
      - uploads:/app/public/uploads

volumes:
  pgdata:
  uploads:
